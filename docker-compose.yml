# =========================================================================== #
# FinSight -- Docker Compose stack.
#
# Grows day by day. Current services:
#   mongo      self-hosted MongoDB (prices, news, run records, API quota ledger)
#   mlflow     MLflow tracking server + model registry      (Day 3)
#   ingestion  one-shot job container (MarketStack prices + Finnhub news)
#   lstm-serve       MLflow model server: models:/finsight-lstm@production       (Day 5)
#   sentiment-serve  MLflow model server: models:/finsight-sentiment@production  (Day 5)
#   backend          FastAPI REST API + Prometheus /metrics                      (Day 5)
#   frontend         nginx: the web portal at http://localhost:8080              (Day 6)
#   scheduler        daily pipeline runs + retrain trigger API on :8001          (Day 7)
#   prometheus       metrics + alert rules at http://localhost:9090              (Day 8)
#   alertmanager     alert routing (retrain webhook) at http://localhost:9093    (Day 8)
#   grafana          dashboards at http://localhost:3000                         (Day 8)
#   node-exporter, cadvisor, mongodb-exporter, nginx-exporter                    (Day 8)
#
# Memory budget (8 GB laptop): every service gets an explicit mem_limit so the
# full stack stays under ~5 GB. See docs/PROJECT_PLAN.md, "Resource budget".
# =========================================================================== #

name: finsight

x-common-env: &common-env
  TZ: ${TZ:-Asia/Kolkata}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MONGO_HOST: mongo            # containers reach Mongo by service name
  MONGO_PORT: "27017"
  MONGO_ROOT_USER: ${MONGO_ROOT_USER}
  MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
  MONGO_DB_NAME: ${MONGO_DB_NAME:-finsight}

services:
  mongo:
    image: mongo:7.0
    container_name: finsight-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Cap the WiredTiger cache: the default (50% of RAM - 1 GB) would starve the
    # rest of the stack on an 8 GB machine. Our data set is a few MB.
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    ports:
      - "127.0.0.1:27017:27017"   # bound to localhost only, never exposed to the LAN
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    networks: [finsight]

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: finsight/mlflow:${FINSIGHT_VERSION:-dev}
    container_name: finsight-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"     # UI + REST API at http://localhost:5000 (host only)
    volumes:
      - mlflow_data:/mlflow       # runs (SQLite) + artifacts survive restarts
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Measured: ~510 MB steady, 514 MB peak while a training run uploads its
    # model (launcher + one uvicorn worker, background jobs disabled).
    mem_limit: 768m
    networks: [finsight]

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: finsight/pipeline:${FINSIGHT_VERSION:-dev}
    container_name: finsight-ingestion
    # One-shot job, not a long-running service: start it with
    #   docker compose run --rm ingestion incremental
    # (Since Day 7 the scheduler runs this every weekday; this stays for manual runs.)
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "finsight.ingestion.cli"]
    command: ["incremental"]
    environment:
      <<: *common-env
      MARKETSTACK_API_KEY: ${MARKETSTACK_API_KEY}
      MARKETSTACK_BASE_URL: ${MARKETSTACK_BASE_URL:-https://api.marketstack.com/v2}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
    volumes:
      - ./configs:/app/configs:ro
      - ./params.yaml:/app/params.yaml:ro
      - ./logs:/app/logs
      - ./reports:/app/reports      # ingestion_last_run.json lands on the host
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m
    networks: [finsight]

  # ------------------------------------------------------------- Day 5 ----
  lstm-serve:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: finsight/serve:${FINSIGHT_VERSION:-dev}
    container_name: finsight-lstm-serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/finsight-lstm@production   # restart after a promotion/rollback
      PORT: "5001"
    ports:
      - "127.0.0.1:5001:5001"     # localhost only (debugging); the backend uses the network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s           # downloads the model from the registry first
    depends_on:
      mlflow:
        condition: service_healthy
    # Measured (rehearsal): `mlflow models serve` = launcher (~250 MB) + uvicorn
    # worker with torch + model (~650 MB) -> ~0.9 GB.
    mem_limit: 1g
    networks: [finsight]

  sentiment-serve:
    # Reuses the image lstm-serve builds (no build: section of its own). Two
    # build sections for one tag made Compose build it twice and leave a ~2 GB
    # untagged copy behind. Build it with lstm-serve, e.g. `make serve`.
    image: finsight/serve:${FINSIGHT_VERSION:-dev}
    pull_policy: never            # local image only; never look for it on Docker Hub
    container_name: finsight-sentiment-serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/finsight-sentiment@production
      PORT: "5002"
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s          # ~270-440 MB model download + load
    depends_on:
      mlflow:
        condition: service_healthy
    # launcher ~250 MB + worker: ~1.4 GB with DistilBERT, ~1.6 GB with FinBERT.
    # Stop it during heavy pipeline runs if memory is tight (the API degrades).
    mem_limit: 2g
    networks: [finsight]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: finsight/backend:${FINSIGHT_VERSION:-dev}
    container_name: finsight-backend
    restart: unless-stopped
    environment:
      <<: *common-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"   # registry down -> answer fast, degraded
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      LSTM_SERVE_URL: http://lstm-serve:5001
      SENTIMENT_SERVE_URL: http://sentiment-serve:5002
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Day 7: the Pipeline Console's "Run now" / "Retrain now" go through the
      # backend, which adds the shared token; the browser never sees it.
      SCHEDULER_URL: http://scheduler:8001
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      ALERTMANAGER_URL: http://alertmanager:9093   # active alerts for the console (Day 8)
    ports:
      - "127.0.0.1:8000:8000"     # API + docs at http://localhost:8000/docs
    depends_on:
      mongo:
        condition: service_healthy
      # Not waiting for the model servers on purpose: the API starts and
      # reports "degraded" until they are up (graceful degradation).
    mem_limit: 384m
    networks: [finsight]

  # ------------------------------------------------------------- Day 6 ----
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: finsight/frontend:${FINSIGHT_VERSION:-dev}
    container_name: finsight-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      # Where the *browser* finds the API (loose coupling: the portal is static
      # files; config.js is generated from this at container start-up).
      # Must also be allowed by the backend's FRONTEND_ORIGINS (CORS).
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      MLFLOW_UI_URL: ${MLFLOW_UI_URL:-http://localhost:5000}
      # Linked from the Pipeline Console.
      PROMETHEUS_UI_URL: ${PROMETHEUS_UI_URL:-http://localhost:9090}
      GRAFANA_UI_URL: ${GRAFANA_UI_URL:-http://localhost:3000}
      ALERTMANAGER_UI_URL: ${ALERTMANAGER_UI_URL:-http://localhost:9093}
    ports:
      - "127.0.0.1:8080:8080"     # the portal: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Deliberately no depends_on: backend. The portal loads on its own and
    # shows "API unreachable" with a retry button until the backend is up.
    mem_limit: 64m                # nginx serving static files needs ~5-10 MB
    networks: [finsight]

  # ------------------------------------------------------------- Day 7 ----
  scheduler:
    # Same image as the ingestion job (one environment for CI and production).
    # The repository is mounted at /app, so `dvc repro` updates YOUR working
    # copy: data/, models/, reports/ and dvc.lock, exactly as if you ran it.
    image: finsight/pipeline:${FINSIGHT_VERSION:-dev}
    pull_policy: never            # built by the ingestion service's build: section
    container_name: finsight-scheduler
    restart: unless-stopped
    entrypoint: ["python", "-m", "finsight.scheduler"]
    command: []
    # Run as your own user so files written into the repository stay yours.
    # Set FINSIGHT_UID / FINSIGHT_GID in .env if `id -u` / `id -g` are not 1000.
    user: "${FINSIGHT_UID:-1000}:${FINSIGHT_GID:-1000}"
    environment:
      <<: *common-env
      HOME: /tmp                  # caches (DVC site cache, matplotlib) go here
      # A user name for tools that look one up (MLflow's run "user" tag, Spark's
      # Hadoop login), which fails when FINSIGHT_UID has no entry in the image.
      USER: finsight
      LOGNAME: finsight
      HADOOP_USER_NAME: finsight
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
      BACKEND_INTERNAL_URL: http://backend:8000
      LSTM_SERVE_URL: http://lstm-serve:5001
      MARKETSTACK_API_KEY: ${MARKETSTACK_API_KEY}
      MARKETSTACK_BASE_URL: ${MARKETSTACK_BASE_URL:-https://api.marketstack.com/v2}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      # The repository belongs to your host user: tell git it is safe, and sign
      # the scheduler's local commits so they are easy to recognise.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
      GIT_AUTHOR_NAME: FinSight scheduler
      GIT_AUTHOR_EMAIL: scheduler@finsight.local
      GIT_COMMITTER_NAME: FinSight scheduler
      GIT_COMMITTER_EMAIL: scheduler@finsight.local
    volumes:
      - .:/app
      # The DVC remote, mounted at the SAME absolute path as on the host so the
      # url in .dvc/config works unchanged. Set DVC_REMOTE_DIR in .env.
      - ${DVC_REMOTE_DIR:?set DVC_REMOTE_DIR in .env (see docs/RUNBOOK.md, Day 7)}:${DVC_REMOTE_DIR}
    ports:
      - "127.0.0.1:8001:8001"     # trigger API + /metrics (localhost only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    # Peak is a full retrain (LSTM training ~1.5 GB) or Spark (1 GB driver +
    # JVM overhead). Steps run one at a time, so 3 GB covers the worst step.
    mem_limit: 3g
    networks: [finsight]

  # ------------------------------------------------------------- Day 8 ----
  # Monitoring. Every UI is bound to localhost; exporters are reachable only
  # on the compose network. Image versions are pinned.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: finsight-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The laptop's disk is small: keep 15 days or 1 GB, whichever comes first.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle          # reload config: curl -X POST localhost:9090/-/reload
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/tests:/etc/prometheus/tests:ro   # promtool test rules
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    networks: [finsight]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: finsight-alertmanager
    restart: unless-stopped
    # Alertmanager cannot read environment variables in its config, so the
    # scheduler token is written to a file (inside the container only) first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '%s' "$$SCHEDULER_TOKEN" > /tmp/scheduler_token
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager --web.external-url=http://localhost:9093
    environment:
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 64m
    networks: [finsight]

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: finsight-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see docs/RUNBOOK.md, Day 8)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/finsight-overview.json
      # Self-hosted, no cloud: no phoning home, no news feed, no plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    mem_limit: 256m
    networks: [finsight]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: finsight-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro
    pid: host
    mem_limit: 48m
    networks: [finsight]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: finsight-cadvisor
    restart: unless-stopped
    # Per-container CPU / memory for EVERY service, including mlflow, the
    # model servers and the frontend, which have no /metrics of their own.
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true          # cAdvisor reads cgroup data for all containers
    mem_limit: 192m
    networks: [finsight]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    container_name: finsight-mongodb-exporter
    restart: unless-stopped
    # diagnosticdata = serverStatus (operations, connections); dbstats = sizes per database.
    command: ["--compatible-mode", "--collector.diagnosticdata", "--collector.dbstats"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 64m
    networks: [finsight]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: finsight-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://frontend:8081/stub_status"]
    depends_on: [frontend]
    mem_limit: 32m
    networks: [finsight]

volumes:
  mongo_data:
  mlflow_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  finsight:
    name: finsight
