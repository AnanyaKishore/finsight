# =========================================================================== #
# FinSight -- Docker Compose stack.
#
# Grows day by day. Current services:
#   mongo      self-hosted MongoDB (prices, news, run records, API quota ledger)
#   mlflow     MLflow tracking server + model registry      (Day 3)
#   ingestion  one-shot job container (MarketStack prices + Finnhub news)
#   lstm-serve       MLflow model server: models:/finsight-lstm@production       (Day 5)
#   sentiment-serve  MLflow model server: models:/finsight-sentiment@production  (Day 5)
#   backend          FastAPI REST API + Prometheus /metrics                      (Day 5)
# Later days add: frontend, scheduler, prometheus, alertmanager, grafana,
# node-exporter, mongodb-exporter.
#
# Memory budget (8 GB laptop): every service gets an explicit mem_limit so the
# full stack stays under ~5 GB. See docs/PROJECT_PLAN.md, "Resource budget".
# =========================================================================== #

name: finsight

x-common-env: &common-env
  TZ: ${TZ:-Asia/Kolkata}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MONGO_HOST: mongo            # containers reach Mongo by service name
  MONGO_PORT: "27017"
  MONGO_ROOT_USER: ${MONGO_ROOT_USER}
  MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
  MONGO_DB_NAME: ${MONGO_DB_NAME:-finsight}

services:
  mongo:
    image: mongo:7.0
    container_name: finsight-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Cap the WiredTiger cache: the default (50% of RAM - 1 GB) would starve the
    # rest of the stack on an 8 GB machine. Our data set is a few MB.
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    ports:
      - "127.0.0.1:27017:27017"   # bound to localhost only, never exposed to the LAN
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    networks: [finsight]

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: finsight/mlflow:${FINSIGHT_VERSION:-dev}
    container_name: finsight-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"     # UI + REST API at http://localhost:5000 (host only)
    volumes:
      - mlflow_data:/mlflow       # runs (SQLite) + artifacts survive restarts
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Measured: ~510 MB steady, 514 MB peak while a training run uploads its
    # model (launcher + one uvicorn worker, background jobs disabled).
    mem_limit: 768m
    networks: [finsight]

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: finsight/pipeline:${FINSIGHT_VERSION:-dev}
    container_name: finsight-ingestion
    # One-shot job, not a long-running service: start it with
    #   docker compose run --rm ingestion incremental
    # (Day 7 replaces manual runs with the scheduler service.)
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "finsight.ingestion.cli"]
    command: ["incremental"]
    environment:
      <<: *common-env
      MARKETSTACK_API_KEY: ${MARKETSTACK_API_KEY}
      MARKETSTACK_BASE_URL: ${MARKETSTACK_BASE_URL:-https://api.marketstack.com/v2}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
    volumes:
      - ./configs:/app/configs:ro
      - ./params.yaml:/app/params.yaml:ro
      - ./logs:/app/logs
      - ./reports:/app/reports      # ingestion_last_run.json lands on the host
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m
    networks: [finsight]

  # ------------------------------------------------------------- Day 5 ----
  lstm-serve:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: finsight/serve:${FINSIGHT_VERSION:-dev}
    container_name: finsight-lstm-serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/finsight-lstm@production   # restart after a promotion/rollback
      PORT: "5001"
    ports:
      - "127.0.0.1:5001:5001"     # localhost only (debugging); the backend uses the network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s           # downloads the model from the registry first
    depends_on:
      mlflow:
        condition: service_healthy
    # Measured (rehearsal): `mlflow models serve` = launcher (~250 MB) + uvicorn
    # worker with torch + model (~650 MB) -> ~0.9 GB.
    mem_limit: 1g
    networks: [finsight]

  sentiment-serve:
    build:                        # same image as lstm-serve (second build is a cache hit)
      context: .
      dockerfile: docker/Dockerfile.serve
    image: finsight/serve:${FINSIGHT_VERSION:-dev}
    container_name: finsight-sentiment-serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/finsight-sentiment@production
      PORT: "5002"
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s          # ~270-440 MB model download + load
    depends_on:
      mlflow:
        condition: service_healthy
    # launcher ~250 MB + worker: ~1.4 GB with DistilBERT, ~1.6 GB with FinBERT.
    # Stop it during heavy pipeline runs if memory is tight (the API degrades).
    mem_limit: 2g
    networks: [finsight]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: finsight/backend:${FINSIGHT_VERSION:-dev}
    container_name: finsight-backend
    restart: unless-stopped
    environment:
      <<: *common-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"   # registry down -> answer fast, degraded
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      LSTM_SERVE_URL: http://lstm-serve:5001
      SENTIMENT_SERVE_URL: http://sentiment-serve:5002
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
    ports:
      - "127.0.0.1:8000:8000"     # API + docs at http://localhost:8000/docs
    depends_on:
      mongo:
        condition: service_healthy
      # Not waiting for the model servers on purpose: the API starts and
      # reports "degraded" until they are up (graceful degradation).
    mem_limit: 384m
    networks: [finsight]

volumes:
  mongo_data:
  mlflow_data:

networks:
  finsight:
    name: finsight
