[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: an AIOps-driven stock analysis platform (price forecasting, news sentiment, portfolio optimisation)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Ananya Kishore" }]
# Runtime dependencies are pinned in requirements/*.txt so that the Docker images,
# the MLproject environment and the local dev environment resolve to identical versions.
dependencies = []

[project.scripts]
finsight-ingest = "finsight.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Code style: PEP 8 enforced by ruff (lint) + black (format), line length 100.
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming, B: bugbear,
# UP: pyupgrade, D: pydocstyle (Google convention), S: bandit (security)
select = ["E", "W", "F", "I", "N", "B", "UP", "D", "S"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S105", "S106", "S311", "S603", "S607", "E731"]
"scripts/**" = ["D", "S603", "S607", "E402"]
# Notebook cells are embedded as strings; their line length follows notebook style.
"scripts/build_eda_notebook.py" = ["D", "E501"]
"scripts/build_dashboards.py" = ["E501"]  # long PromQL strings read better unbroken
"tests/unit/test_monitoring.py" = ["F811"]  # reuses the scheduler tests' make_service fixture
# `from pyspark.sql import functions as F` is the universal PySpark convention.
"src/finsight/etl/**" = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running MongoDB (docker compose up -d mongo)",
    "e2e: needs the full docker compose stack",
]
