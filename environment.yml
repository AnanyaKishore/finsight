# Local dev environment (same pattern as q4demo/environment.yml).
#   mamba env create -f environment.yml
#   mamba activate finsight
#   pip install -e .
# Python is pinned to 3.11 because PySpark, PyTorch (CPU) and MLflow all ship
# stable wheels for it; the Docker images use python:3.11-slim for parity.
name: finsight
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git-lfs
  - openjdk=17        # needed by PySpark from Day 2
  - pip:
      - -r requirements/dev.txt
