# FinSight -- Prometheus scrape configuration (Day 8).
# Every component of the stack is scraped, directly or through an exporter:
#   backend, scheduler (pipeline + drift + live model error), host (node-exporter),
#   containers incl. mlflow / model servers / frontend (cAdvisor), MongoDB
#   (mongodb-exporter), nginx (nginx-exporter), and the monitoring stack itself.
# The model servers (`mlflow models serve`) expose no /metrics; they are covered
# by cAdvisor (CPU, memory, restarts), the backend's model-call latency and
# error counters, and finsight_dependency_up (pinged on every backend scrape).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    project: finsight

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
        labels: {component: api}

  - job_name: scheduler
    scrape_interval: 30s
    static_configs:
      - targets: ["scheduler:8001"]
        labels: {component: pipeline}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {component: host}

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {component: containers}
    metric_relabel_configs:
      # Keep the series the dashboards use; cAdvisor's full output is large.
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|start_time_seconds|network_(receive|transmit)_bytes_total|oom_events_total|last_seen)"
        action: keep

  - job_name: mongodb
    scrape_interval: 30s
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels: {component: database}

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: {component: frontend}

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {component: monitoring}

  - job_name: grafana
    scrape_interval: 60s
    static_configs:
      - targets: ["grafana:3000"]
        labels: {component: monitoring}
