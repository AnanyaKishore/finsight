# Load every dashboard JSON in /var/lib/grafana/dashboards (from
# monitoring/grafana/dashboards, generated by scripts/build_dashboards.py).
apiVersion: 1
providers:
  - name: finsight
    folder: FinSight
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
