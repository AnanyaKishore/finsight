# --------------------------------------------------------------------------- #
# params.yaml -- single source of truth for every tunable value.
# DVC tracks these keys as stage dependencies ("params:" in dvc.yaml), so a
# change here invalidates exactly the stages that use it, and every MLflow run
# logs the values it was produced with.
# Sections are added day by day; Day 1 defines ingestion only.
# --------------------------------------------------------------------------- #

ingestion:
  # Price history to backfill on first run. The proposal said 6 months, but a
  # 100-day lookback + 14-day horizon leaves only ~12 training windows per
  # ticker on ~125 trading days. 365 days (the MarketStack free-plan maximum)
  # gives ~137 windows per ticker at the SAME quota cost (1 call per ticker).
  price_backfill_days: 365
  # News history to backfill (Finnhub free tier keeps ~1 year).
  news_backfill_days: 182
  # Finnhub is queried in windows of this many days so no window hits the
  # per-response article cap.
  news_window_days: 7
  # Upper bound on stored articles per ticker per window, so CPU-only DistilBERT
  # scoring stays bounded (~10 tickers x 26 weeks x 40 = ~10k articles max).
  max_articles_per_window: 40
  # MarketStack free plan = 100 requests/month and EVERY ticker in a call counts
  # as one request. The guard refuses calls that would cross (budget - reserve)
  # and the ingestion falls back to the secondary provider instead.
  marketstack_monthly_budget: 100
  marketstack_reserve: 5
  # Secondary price source used only when MarketStack is unavailable / over quota.
  price_fallback_provider: yfinance   # one of: yfinance, none
  # Minimum seconds between Finnhub calls (free tier: 60 calls/minute).
  finnhub_min_interval_s: 1.1
  # HTTP retry policy (exponential backoff with full jitter).
  http_max_retries: 4
  http_backoff_base_s: 1.0
  http_backoff_max_s: 30.0
  http_timeout_s: 20

# --------------------------------------------------------------------------- #
# Day 2: data engineering
# --------------------------------------------------------------------------- #
export:
  # Snapshot of MongoDB written by the `export` DVC stage (always re-run; DVC
  # skips everything downstream when the snapshot's content hash is unchanged).
  prices_path: data/raw/prices.parquet
  news_path: data/raw/news.parquet
  manifest_path: reports/export_manifest.json

validation:
  # Expectation suite applied by the `validate` stage. Severity "error" stops
  # the DVC pipeline (non-zero exit); "warn" is reported but does not block.
  report_path: reports/data_quality.json
  # LSTM needs lookback (100) + horizon (14) observed days per ticker.
  min_history_rows: 114
  # Trading days (NYSE calendar) absent from a ticker's history.
  max_missing_days_warn: 3
  max_missing_days_error: 10
  # How many trading days the newest bar may lag the latest expected session.
  max_staleness_days: 3
  # Robust z-score (median/MAD) of daily log returns above which a day is
  # flagged as an outlier (warn): real market moves happen, so never blocking.
  return_outlier_z: 6.0
  # A |daily log return| above this is almost certainly bad data for large
  # caps (e.g. an unadjusted stock split) and blocks the pipeline.
  max_abs_log_return: 0.5
  # News: weeks with fewer articles than this are reported per ticker.
  min_articles_per_week: 5

etl:
  # PySpark in local mode: 4 cores + 1 GB driver fits the 8 GB laptop budget
  # alongside MongoDB and the other services (see PROJECT_PLAN memory budget).
  spark_master: local[4]
  driver_memory: 1g
  shuffle_partitions: 8          # Spark default of 200 is far too many here
  spark_ui: false                # set true to inspect the DAG at localhost:4040
  # Calendar alignment: forward-fill at most this many consecutive missing
  # trading days per ticker; longer gaps are left out (and reported).
  max_ffill_days: 2
  # Rolling windows (trading days) for engineered features.
  feature_windows: [5, 20]
  processed_prices_path: data/processed/prices
  processed_news_path: data/processed/news
  news_weekly_path: data/processed/news_weekly
  metrics_path: reports/etl_metrics.json

# --------------------------------------------------------------------------- #
# Day 3: price forecasting (LSTM)
# --------------------------------------------------------------------------- #
lstm:
  lookback: 100            # input window, trading days (proposal)
  horizon: 14              # forecast steps, trading days (proposal)
  # Chronological split per ticker, counted in forecast origins (windows).
  # A purge gap of `horizon` origins separates train/val and val/test, so no
  # training *target* overlaps a validation/test target (look-ahead leakage).
  val_origins: 15
  test_origins: 15
  # Hyper-parameter grid (2 x 2 x 2 = 8 configurations, CPU-friendly).
  grid:
    hidden_size: [32, 64]
    num_layers: [1, 2]
    learning_rate: [0.001, 0.003]
  dropout: 0.1             # applied between stacked LSTM layers only
  batch_size: 64
  max_epochs: 60
  patience: 8              # early stopping on validation loss
  seed: 42
  torch_threads: 6         # of 12 cores: leave headroom for Docker services
  selection_metric: val_mape
  experiment_name: finsight-lstm
  model_dir: models/lstm
  train_report: reports/lstm_train.json
  metrics_report: reports/lstm_metrics.json

# Day 4: LSTM analysis -- kept out of `lstm` so changing it never retrains the model.
lstm_explain:
  attribution_block: 10            # occlusion block size (days), used by evaluate_lstm
  experiment_seeds: [42, 43, 44]   # feature experiment (MLflow only, not a DVC stage)

# --------------------------------------------------------------------------- #
# Day 4-5: news sentiment (pretrained models, no fine-tuning)
# --------------------------------------------------------------------------- #
sentiment:
  # Candidate models, pinned to Hugging Face Hub commits (same bytes everywhere).
  # The promotion gate (registry) chooses which one serves; ties keep this order.
  candidates:
    distilbert_sst2:              # the proposal's model (Apache-2.0)
      repo: distilbert/distilbert-base-uncased-finetuned-sst-2-english
      revision: 714eb0fa89d2f80546fda750413ed43d93601a13
      base_dir: models/sentiment/base/distilbert_sst2
      model_dir: models/sentiment/candidates/distilbert_sst2
      trained_on: []
    finbert:                      # Day 5 challenger (CC BY-NC-SA 4.0, academic use)
      repo: ProsusAI/finbert
      revision: 0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031
      base_dir: models/sentiment/base/finbert
      model_dir: models/sentiment/candidates/finbert
      trained_on: [financial_phrasebank]   # its PhraseBank score is contaminated
  # Labelled evaluation data (DVC stage fetch_sentiment_data).
  datasets:
    twitter_financial_news:       # MIT; no candidate trained on it -> fair gate
      repo: zeroshot/twitter-financial-news-sentiment
      revision: ccbe24de388e287beb92dd393a335c376b350ac3
      file: sent_valid.csv
      path: data/external/twitter_financial_news.csv
    financial_phrasebank:         # CC BY-NC-SA 3.0; reported for comparability
      repo: takala/financial_phrasebank
      revision: 8d3fe0c36d5feec6b3cc5e455b0fcb4820fb9964
      agreement: AllAgree
      path: data/external/financial_phrasebank.csv
  gate_dataset: twitter_financial_news   # band calibration + promotion metric
  calibration_share: 0.5     # half calibrates the neutral band, half is the test set
  seed: 42
  max_length: 256            # tokens; headline + summary is <= 1,000 characters
  batch_size: 32
  checkpoint_every: 500      # articles per chunk: progress line + resumable checkpoint
  torch_threads: 6
  top_headlines: 3           # per week and side: the explanation shown in the portal
  experiment_name: finsight-sentiment
  scores_path: data/sentiment/article_scores.parquet
  weekly_path: data/sentiment/weekly.parquet
  scoring_report: reports/sentiment_scoring.json

# --------------------------------------------------------------------------- #
# Day 4: portfolio optimisation (Modern Portfolio Theory)
# --------------------------------------------------------------------------- #
portfolio:
  window_days: 30            # daily returns used for mu / Sigma (proposal: last 30 days)
  weight_step: 0.1           # 10 % lattice -> C(19, 9) = 92,378 long-only portfolios
  # Annual risk-free rate in the Sharpe ratio: the 3-month US T-bill yield
  # (~3.9 % in Oct 2026). Update it when rates move; it is a tracked DVC param,
  # so changing it re-runs the optimisation.
  risk_free_rate: 0.039
  trading_days_per_year: 252
  rebalance_days: 5          # walk-forward backtest: re-optimise weekly
  # If no portfolio has a positive excess return, max-Sharpe is meaningless
  # (it would pick the most volatile one): use minimum volatility instead.
  no_positive_sharpe_fallback: min_volatility   # or: none
  experiment_name: finsight-portfolio
  report: reports/portfolio.json
  backtest_report: reports/portfolio_backtest.json

# --------------------------------------------------------------------------- #
# Day 5: model registry + promotion gate
# --------------------------------------------------------------------------- #
registry:
  lstm_name: finsight-lstm
  sentiment_name: finsight-sentiment
  # Acceptance (test plan): LSTM test MAPE at most 2 % worse than naive.
  lstm_acceptance_max_ratio_to_naive: 1.02
  # A challenger must beat the champion by MORE than this on the same data.
  lstm_min_improvement: 0.0          # MAPE points
  sentiment_min_improvement: 0.0     # macro-F1
  report: reports/promotion.json
