# =========================================================================== #
# FinSight CI pipeline (DVC DAG).  Run:  dvc repro      Visualise:  dvc dag
#
#   unit_tests ─► export ─► validate ─► process ─┬─► train_lstm ─► evaluate_lstm ─┐
#        │                                        ├─► optimize_portfolio           │
#        │                                        └─────────────┐                  ▼
#        └─► evaluate_sentiment@{distilbert_sst2,finbert} ─────► register ─► score_sentiment
#              ▲ fetch_sentiment@{...}, fetch_sentiment_data      (MLflow registry gate)
#
# * unit_tests is the CI gate: if the suite fails, nothing downstream runs.
# * export is always re-run (it reads the live MongoDB) but writes
#   byte-identical files when the data has not changed, so DVC skips the rest.
# * validate exits non-zero on any blocking data-quality failure.
# * Outputs under data/ are cached by DVC (dvc push -> local remote);
#   small JSON reports are committed to Git (cache: false). The compact ones
#   (unit_tests, etl_metrics) are DVC metrics: `dvc metrics show`.
# * fetch_sentiment downloads the pinned model + labelled data once (DVC-cached;
#   re-runs only if the pinned revisions change).
# * Stages that publish results for the API (score_sentiment,
#   optimize_portfolio) also upsert MongoDB; the DVC outputs stay the source
#   of truth (after a Mongo reset: dvc repro -f score_sentiment optimize_portfolio).
# * register runs the champion/challenger gate and writes reports/promotion.json,
#   the production pointer used by score_sentiment, serving and the API (Day 5).
# =========================================================================== #

stages:
  unit_tests:
    cmd: python -m finsight.ci.run_unit_tests
    deps:
      - src
      - tests/unit
      - tests/conftest.py
      - tests/factories.py
      - pyproject.toml
    metrics:
      - reports/unit_tests.json:
          cache: false

  export:
    cmd: python -m finsight.data.export
    always_changed: true          # reads MongoDB, which DVC cannot hash
    deps:
      - reports/unit_tests.json   # gate: only runs after the tests pass
      - src/finsight/data/export.py
      - configs/tickers.yaml
    params:
      - export
    outs:
      - data/raw/prices.parquet
      - data/raw/news.parquet
      - reports/export_manifest.json:
          cache: false

  validate:
    cmd: python -m finsight.data.validate
    deps:
      - data/raw/prices.parquet
      - data/raw/news.parquet
      - src/finsight/data/validate.py
      - src/finsight/common/timeutils.py
    params:
      - validation
    outs:
      - reports/data_quality.json:   # detailed, per-ticker report (Git-tracked)
          cache: false

  process:
    cmd: python -m finsight.etl.process
    deps:
      - data/raw/prices.parquet
      - data/raw/news.parquet
      - reports/data_quality.json  # gate: only runs on validated data
      - src/finsight/etl
    params:
      - etl
    outs:
      - data/processed/prices
      - data/processed/news
      - data/processed/news_weekly
    metrics:
      - reports/etl_metrics.json:
          cache: false

  train_lstm:
    cmd: python -m finsight.models.lstm.train
    deps:
      - data/processed/prices
      # only the code that shapes the model (editing evaluate/explain/feature
      # experiment code must not retrain it)
      - src/finsight/models/tracking.py
      - src/finsight/models/lstm/data.py
      - src/finsight/models/lstm/network.py
      - src/finsight/models/lstm/metrics.py
      - src/finsight/models/lstm/pyfunc_model.py
      - src/finsight/models/lstm/pyfunc_entry.py
      - src/finsight/models/lstm/train.py
    params:
      - lstm
    outs:
      - models/lstm               # packaged pyfunc model + run.json (MLflow run ID)
      - reports/plots/lstm_learning_curve.csv:   # plotted below (top-level `plots`)
          cache: false
    metrics:
      - reports/lstm_train.json:  # selection result on the validation windows
          cache: false

  evaluate_lstm:
    cmd: python -m finsight.models.lstm.evaluate
    deps:
      - models/lstm
      - data/processed/prices
      - src/finsight/models/lstm/evaluate.py
      - src/finsight/models/lstm/metrics.py
      - src/finsight/models/lstm/explain.py
    params:
      - lstm.lookback
      - lstm.horizon
      - lstm.val_origins
      - lstm.test_origins
      - lstm_explain.attribution_block
    metrics:
      - reports/lstm_metrics.json:  # held-out test: model vs naive vs drift
          cache: false
    outs:
      - reports/plots/lstm_test_forecasts.png:
          cache: false
      - reports/plots/lstm_horizon_mape.csv:
          cache: false
      - reports/plots/lstm_input_attribution.csv:
          cache: false

  # ------------------------------------------------------------- Day 4 ----
  fetch_sentiment:                    # one stage per candidate: fetch_sentiment@finbert ...
    foreach: ${sentiment.candidates}
    do:
      cmd: python -m finsight.sentiment.fetch model ${key}
      deps:
        - src/finsight/sentiment/fetch.py
      params:
        - sentiment.candidates.${key}.repo
        - sentiment.candidates.${key}.revision
      outs:
        - ${item.base_dir}               # DVC-cached (offline after the first run)

  fetch_sentiment_data:
    cmd: python -m finsight.sentiment.fetch data
    deps:
      - src/finsight/sentiment/fetch.py
    params:
      - sentiment.datasets
    outs:
      - data/external/twitter_financial_news.csv
      - data/external/financial_phrasebank.csv

  evaluate_sentiment:                 # evaluate_sentiment@distilbert_sst2, @finbert
    foreach: ${sentiment.candidates}
    do:
      cmd: python -m finsight.sentiment.evaluate --candidate ${key}
      deps:
        - reports/unit_tests.json         # CI gate
        - ${item.base_dir}
        - data/external/twitter_financial_news.csv
        - data/external/financial_phrasebank.csv
        - src/finsight/sentiment/scoring.py
        - src/finsight/sentiment/evaluate.py
        - src/finsight/sentiment/pyfunc_model.py
        - src/finsight/sentiment/pyfunc_entry.py
        - src/finsight/models/tracking.py
      params:
        - sentiment.candidates.${key}
        - sentiment.gate_dataset
        - sentiment.calibration_share
        - sentiment.seed
        - sentiment.max_length
      outs:
        - ${item.model_dir}               # pyfunc model + run.json (MLflow run ID)
        - reports/plots/sentiment_band_${key}.csv:
            cache: false
        - reports/plots/sentiment_confusion_${key}.png:
            cache: false
      metrics:
        - reports/sentiment_eval_${key}.json:   # gate_* = Twitter financial news test half
            cache: false

  register:                           # MLflow registry + champion/challenger gate
    cmd: python -m finsight.registry.register
    deps:
      - models/lstm
      - reports/lstm_metrics.json
      - data/processed/prices             # the LSTM champion is re-scored on today's windows
      # one pair of lines per sentiment candidate:
      - models/sentiment/candidates/distilbert_sst2
      - reports/sentiment_eval_distilbert_sst2.json
      - models/sentiment/candidates/finbert
      - reports/sentiment_eval_finbert.json
      - data/external/twitter_financial_news.csv
      - src/finsight/registry
    params:
      - registry
      - sentiment.gate_dataset
      - sentiment.calibration_share
      - sentiment.seed
    outs:
      - reports/promotion.json:           # decisions + production pointers (Git-tracked)
          cache: false

  score_sentiment:
    cmd: python -m finsight.sentiment.score
    deps:
      - data/processed/news
      - reports/promotion.json            # which model is in production
      - models/sentiment/candidates/distilbert_sst2
      - models/sentiment/candidates/finbert
      - src/finsight/sentiment/score.py
      - src/finsight/sentiment/scoring.py
      - src/finsight/registry/pointer.py
    params:
      - sentiment.top_headlines
    outs:
      - data/sentiment/article_scores.parquet:
          persist: true                     # incremental cache: kept between runs
      - data/sentiment/weekly.parquet
    metrics:
      - reports/sentiment_scoring.json:
          cache: false

  optimize_portfolio:
    cmd: python -m finsight.portfolio.optimize
    deps:
      - data/processed/prices
      - src/finsight/portfolio
    params:
      - portfolio
    metrics:
      - reports/portfolio.json:             # today's allocation + in/out-of-sample Sharpe
          cache: false
    outs:
      - reports/portfolio_backtest.json:
          cache: false
      - reports/plots/portfolio_frontier.csv:
          cache: false
      - reports/plots/portfolio_backtest.csv:
          cache: false
      - reports/plots/portfolio_allocation.png:
          cache: false
      - reports/plots/portfolio_frontier.png:
          cache: false
      - reports/plots/portfolio_backtest.png:
          cache: false

# `dvc plots show` renders these into dvc_plots/index.html
plots:
  - LSTM learning curve (selected configuration):
      x: epoch
      y:
        reports/plots/lstm_learning_curve.csv: [train_loss, val_loss]
  - Test MAPE by forecast horizon (lower is better):
      x: horizon
      y:
        reports/plots/lstm_horizon_mape.csv: [model_mape, naive_mape, drift_mape]
  - reports/plots/lstm_test_forecasts.png
  - LSTM input attribution (occlusion; lag 1 = most recent day):
      template: bar_horizontal
      x: mean_abs_change_pct
      y:
        reports/plots/lstm_input_attribution.csv: block
  - Sentiment neutral-band calibration (Twitter financial news, calibration half):
      x: band
      y:
        reports/plots/sentiment_band_distilbert_sst2.csv: macro_f1
        reports/plots/sentiment_band_finbert.csv: macro_f1
  - reports/plots/sentiment_confusion_distilbert_sst2.png
  - reports/plots/sentiment_confusion_finbert.png
  - Portfolio walk-forward backtest (growth of $1, out of sample):
      x: date
      y:
        reports/plots/portfolio_backtest.csv: [max_sharpe, equal_weight, min_volatility]
  - Portfolio grid (annualised, last window):
      template: scatter
      x: volatility
      y:
        reports/plots/portfolio_frontier.csv: expected_return
  - reports/plots/portfolio_allocation.png
  - reports/plots/portfolio_frontier.png
